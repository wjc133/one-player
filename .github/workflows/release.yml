name: Release

on:
  push:
    tags:
      - 'v*'
  # Build every platform without creating a release, including when run against a tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validate version and frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: pnpm release:check
      - run: pnpm test
      - run: pnpm build

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' src-tauri/rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustup default "$toolchain"
          rustup target add --toolchain "$toolchain" "$RUST_TARGET"
        env:
          RUST_TARGET: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Check updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::Configure TAURI_SIGNING_PRIVATE_KEY before building signed updates."
            exit 1
          fi
      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - name: Build installers
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
          retryAttempts: 2
          uploadUpdaterJson: false
      - name: Collect installers
        env:
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: node scripts/collect-release-assets.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.target }}
          path: release-bundles/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          pattern: bundles-*
          path: release-bundles
          merge-multiple: true
      - name: Create release and upload signed updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            node -e "if (!require('./release-state.json').isDraft) throw new Error('This release is already published; create a new version tag instead.')"
          else
            extra_args=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              extra_args+=(--prerelease)
            fi
            notes_file=".github/release-notes/$RELEASE_TAG.md"
            if [[ ! -f "$notes_file" ]]; then
              notes_file=".github/release-notes.md"
            fi
            gh release create "$RELEASE_TAG" \
              --verify-tag --draft --title "One Player $RELEASE_TAG" \
              --generate-notes --notes-file "$notes_file" \
              "${extra_args[@]}"
          fi
          gh release view "$RELEASE_TAG" --json body --jq '.body' > release-notes.txt
          RELEASE_NOTES_FILE=release-notes.txt node scripts/generate-updater-manifest.mjs
          rm release-bundles/updater-*.json
          (cd release-bundles && sha256sum -- * > SHA256SUMS.txt)
          gh release upload "$RELEASE_TAG" release-bundles/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
